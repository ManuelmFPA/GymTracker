services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gym_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - gym_tracker_data:/var/lib/postgresql/data

volumes:
  gym_tracker_data:
